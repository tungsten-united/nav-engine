<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nav Maps</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="viz.css">
</head>
<body>
  <div class="layout">
    <main class="stage">
      <header class="head">
        <div>
          <h1 id="title">Navigation graph</h1>
          <p id="subtitle" class="sub"></p>
          <nav class="sub links"><a href="/">Tools</a> · <a href="/dash/">Recordings</a> ·
            <a href="/loc/">Localize</a> · <a href="/nav/">Navigate</a></nav>
        </div>
        <div class="tools">
          <select id="maps" aria-label="Map"></select>
          <span id="style" class="seg" role="group" aria-label="Edge style">
            <button type="button" data-style="smooth" aria-pressed="true">Smooth</button><button type="button" data-style="straight" aria-pressed="false">Straight</button>
          </span>
          <button id="tracks" type="button" aria-pressed="false" title="The whole walks, faint">Tracks</button>
          <button id="pruned" type="button" aria-pressed="false" title="What the cleaner left out, faint">Pruned</button>
          <button id="fit" type="button">Fit</button>
        </div>
      </header>
      <div id="graph" class="graph">
        <svg id="svg" role="img" aria-label="Navigation graph"><g id="world"></g></svg>
        <div id="tip" class="tip" hidden></div>
        <p id="empty" class="empty" hidden></p>
      </div>
      <footer id="legend" class="legend"></footer>
    </main>
    <aside id="panel" class="panel" aria-live="polite"></aside>
  </div>
  <dialog id="zoom" class="zoom"><img alt=""><p class="caption"></p><form method="dialog"><button>Close</button></form></dialog>
  <script src="../config.js"></script>
  <script src="viz.js"></script>
</body>
</html>
