[project]
name = "nav-engine"
version = "0.1.0"
description = "Navigation engine for blind users: walkthrough recordings -> semantic topological maps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.scripts]
nav = "nav.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
