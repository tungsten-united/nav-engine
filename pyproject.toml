[project]
name = "nav-engine"
version = "0.1.0"
description = "Navigation engine for blind users: walkthrough recordings -> semantic topological maps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.scripts]
nav = "nav.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Map pipeline (nav map build): video decoding, IMU signal processing, frame embeddings, voice transcription.
# Imported lazily, so the recorder never loads torch.
map = [
    "av>=14",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "scipy>=1.14",
    "torch>=2.8",
    "transformers>=4.56",
    "accelerate>=1.0",
    "typesafe-sdk>=0.7.4",
]

[tool.uv]
default-groups = ["dev", "map"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
