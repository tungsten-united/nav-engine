# Environment of the nav-api Cloud Run service (deploy/cloudrun.sh). Secrets are not here: see secrets_of in the script.
# The debugging pages that call it are served by map-api and by helium-nav, hence their origins.
NAV_APP: nav-api
NAV_DATA_DIR: /data
NAV_CORS_ORIGINS: https://map-api-613464313064.europe-southwest1.run.app,https://helium-nav.oscarmartinez.dev
NAV_CORS_ORIGIN_REGEX: ^(http://(localhost|127\.0\.0\.1)(:\d+)?|https://map-api-[a-z0-9]+-[a-z]+\.a\.run\.app)$
NAV_INFER_URL: https://helium-nav-infer.oscarmartinez.dev
NAV_FRONTEND_URL: https://map-api-613464313064.europe-southwest1.run.app
# Every call nav-api answers is recorded here, frames included (nav/nav_api/capture.py): the bucket's live/ prefix.
NAV_CAPTURE_DIR: /live
