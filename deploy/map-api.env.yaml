# Environment of the map-api Cloud Run service (deploy/cloudrun.sh). Secrets are not here: see secrets_of in the script.
NAV_APP: map-api
NAV_DATA_DIR: /data
NAV_ALLOW_DELETE: "0"
NAV_CORS_ORIGINS: https://helium-nav.oscarmartinez.dev,https://orient.harshdeepsingh.dev,https://orient-web-6aag5xwaia-ew.a.run.app,https://orient-web-613464313064.europe-west1.run.app  # Orient's /map records walks (Cloudflare and its Cloud Run mirror)
NAV_CORS_ORIGIN_REGEX: ^http://(localhost|127\.0\.0\.1)(:\d+)?$
NAV_AUTO_BUILD: "1"  # a walk that finalizes rebuilds its place's map
NAV_INFER_URL: https://helium-nav-infer.oscarmartinez.dev
